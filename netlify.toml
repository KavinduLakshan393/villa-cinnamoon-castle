[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

# Built files carry a content hash in their name, so they never change.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Photographs and clips keep their names: cache for a week, then refresh in the background.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

# Proxy /api calls to the Railway backend
[[redirects]]
  from = "/api/*"
  to = "https://villa-cinnamoon-castle-production.up.railway.app/api/:splat"
  status = 200
  force = true

# Keep the SPA fallback last so React Router routes resolve to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
