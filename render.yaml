services:
  - type: web
    name: villa-cinnamoon-castle-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build && npm run db:migrate:deploy && npm run db:seed
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: AUTH_ACCESS_TOKEN_SECRET
        generateValue: true
      - key: AUTH_ACCESS_TOKEN_TTL_MINUTES
        value: "15"
      - key: AUTH_REFRESH_TOKEN_TTL_DAYS
        value: "7"
      - key: TRUST_PROXY
        value: "true"
